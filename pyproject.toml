[project]
name = "library-claim-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.157.0",
    "google-genai>=2.32",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "selectolax>=1.0.2",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
